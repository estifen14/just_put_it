apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-store
  namespace: argocd
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200" # Your OpenBao internal K8s address
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-role" # The OpenBao role we will create in Step B
          serviceAccountRef:
            name: "argocd-sa" # References the SA created above
            audiences:
              - "vault"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sync-ghcr-credentials
  namespace: argocd
spec:
  refreshInterval: "10m"
  secretStoreRef:
    # ----------------------------------------------------------------------------------
    # PLACEHOLDER: Replace 'openbao-store' with the actual name of your SecretStore
    # Ensure this SecretStore is created in the 'argocd' namespace.
    # ----------------------------------------------------------------------------------
    name: openbao-store 
    kind: SecretStore
  target:
    name: ghcr-credentials # The Image Updater will look for a Secret with this name
    creationPolicy: Owner
  data:
    # The Image Updater requires the format: <github_username>:<github_pat>
    - secretKey: credentials
      remoteRef:
        # ----------------------------------------------------------------------------------
        # PLACEHOLDER: Replace with your actual OpenBao path
        # Example: just_put_it/github
        # ----------------------------------------------------------------------------------
        key: github 
        # ----------------------------------------------------------------------------------
        # PLACEHOLDER: Replace with the key inside OpenBao
        # Ensure the value stored in OpenBao is formatted as: myusername:ghp_123456789...
        # ----------------------------------------------------------------------------------
        property: ghcr_credentials 
