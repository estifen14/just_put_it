apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-service
  namespace: argocd
  annotations:
    # ----------------------------------------------------------------------------------
    # 1. Image List: Tells Image Updater which image to monitor
    # PLACEHOLDER: Replace 'myusername' with your actual GitHub username
    # Example: argocd-image-updater.argoproj.io/image-list: my-image=ghcr.io/estifenabrea/notes_service
    # ----------------------------------------------------------------------------------
    argocd-image-updater.argoproj.io/image-list: my-image=ghcr.io/estifen14/just_put_it_notes_service

    # ----------------------------------------------------------------------------------
    # 2. Update Strategy: Deploys the latest built tag
    # ----------------------------------------------------------------------------------
    argocd-image-updater.argoproj.io/my-image.update-strategy: latest

    # ----------------------------------------------------------------------------------
    # 3. Pull Secret: Links to the secret created by ESO in the previous step
    # ----------------------------------------------------------------------------------
    argocd-image-updater.argoproj.io/my-image.pull-secret: secret:argocd/ghcr-credentials#credentials

    # ----------------------------------------------------------------------------------
    # 4. Helm Override: Tells Image Updater which Helm values to override
    # These must match the values inside your Helm chart's values.yaml
    # ----------------------------------------------------------------------------------
    argocd-image-updater.argoproj.io/my-image.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/my-image.helm.image-tag: image.tag

spec:
  project: default
  source:
    # ----------------------------------------------------------------------------------
    # PLACEHOLDER: Your GitHub repository URL
    # Example: https://github.com/estifenabrea/just_put_it.git
    # ----------------------------------------------------------------------------------
    repoURL: 'https://github.com/estifen14/just_put_it.git'
    
    targetRevision: HEAD # Deploy from the main/master branch

    # ----------------------------------------------------------------------------------
    # PLACEHOLDER: The path within the repo where your Helm chart lives
    # Example: k8s/helm/notes-service
    # ----------------------------------------------------------------------------------
    path: k8s/helm/notes-service 

    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc' # Deploy to the local K3s cluster
    namespace: note-service-dev              # The namespace where your app runs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
