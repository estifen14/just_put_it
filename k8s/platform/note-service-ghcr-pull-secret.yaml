apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: note-service-dev
spec:
  refreshInterval: "1h"
  secretStoreRef:
    # This MUST match the name of the SecretStore you created in note-service-dev
    name: openbao-store
    kind: SecretStore
  target:
    name: ghcr-pull-secret
    template:
      # This is the magic. ESO dynamically converts your OpenBao string into a valid Kubelet Docker JSON!
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths": {"ghcr.io": {"auth": "{{ .credentials | b64enc }}"}}}'
  data:
    - secretKey: credentials
      remoteRef:
        key: github
        property: ghcr_credentials