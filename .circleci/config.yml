version: 2.1

jobs:
  build-and-push:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24
      
      - run:
          name: Setup Global Environment Variables
          command: |
            # 1. Docker requires repository names to be strictly lowercase.
            # 2. We use 'tr' to convert GHCR_USERNAME to lowercase.
            # 3. We save the resulting IMAGE_NAME to $BASH_ENV so it is globally available.
            LOWER_USER=$(echo "$GHCR_USERNAME" | tr "[:upper:]" "[:lower:]")
            echo "export IMAGE_NAME=ghcr.io/${LOWER_USER}/just_put_it_notes_service" >> $BASH_ENV

      - run:
          name: Build Docker Image
          command: |
            cd services/notes_service
            docker build -t $IMAGE_NAME:${CIRCLE_SHA1} .
            docker tag $IMAGE_NAME:${CIRCLE_SHA1} $IMAGE_NAME:latest
      
      - run:
          name: Authenticate with GHCR
          command: |
            echo $GHCR_PAT | docker login ghcr.io -u $GHCR_USERNAME --password-stdin
      
      - run:
          name: Push Docker Image to GHCR
          command: |
            docker push $IMAGE_NAME:${CIRCLE_SHA1}
            docker push $IMAGE_NAME:latest
      
      - run:
          name: CD Handoff - Update GitOps Repository
          command: |
            # Clone the GitOps repository using the PAT for authentication
            git clone https://estifen14:${GHCR_PAT}@github.com/estifen14/just_put_it-argo_cd.git
            cd just_put_it-argo_cd
            
            # Update the image tag to the exact Git SHA
            sed -i.bak "s/tag: .*/tag: \"${CIRCLE_SHA1}\"/" helm/notes-service/values.yaml
            rm helm/notes-service/values.yaml.bak
            
            # Configure Git identity and push
            git config --global user.email "circleci-bot@justputit.com"
            git config --global user.name "CircleCI Bot"
            git add helm/notes-service/values.yaml
            git commit -m "chore: deploy notes-service ${CIRCLE_SHA1}"
            git push origin main

workflows:
  main-workflow:
    jobs:
      - build-and-push:
          filters:
            branches:
              only: main
